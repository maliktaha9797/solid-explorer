# When a tag such as v1.0.0 is pushed: check everything, build, and create a GitHub Release with the
# single file attached as solid-explorer-<version>.html. The tag must match the version in package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the Release and upload its file

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Work out the version, and check it matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::The tag is $TAG but package.json says $package_version. Tag the commit that bumped package.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Lint, test and build
        run: npm run check

      - name: Check the build is one small, self-contained file
        run: .github/scripts/check-single-file.sh dist

      - name: Name the file for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp dist/index.html "solid-explorer-${VERSION}.html"

      - name: Take the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { show = (index($0, "[" v "]") > 0); next }
            show
          ' CHANGELOG.md > release-notes.md

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--verify-tag)
          if [ -s release-notes.md ]; then
            flags+=(--notes-file release-notes.md)
          else
            flags+=(--generate-notes)
          fi
          case "$VERSION" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "solid-explorer-${VERSION}.html" --title "Solid Explorer ${VERSION}" "${flags[@]}"
