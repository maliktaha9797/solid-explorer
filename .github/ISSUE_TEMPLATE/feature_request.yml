name: Feature request
description: Suggest a change or something new
title: 'Idea: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. If it is a new solid, please use the "New shape" form instead.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to teach or learn?
      description: Describe the lesson or the textbook question, not the button you want.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: What would you like to see, and how would it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do at the moment?
      description: Optional. Any way you get round it today.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      description: Either answer is fine. We will talk it through first.
      options:
        - Yes, I would like to try
        - I could help test it
        - No, I am only suggesting it
    validations:
      required: true
